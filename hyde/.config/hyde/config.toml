# Configuration file for HyDE
# Environment variables should be on top
# Updated config.toml file can be found at $HOME/.local/share/hyde/config.toml

# Animation speed dial. Multiplies every duration in the active preset
# (hyde-shell animations --set <name>). Lower = snappier.
#   1.0 = preset as-is   0.7 = noticeably faster   0.5 = very snappy
[hyprland.anim]
duration_scale = 0.6
